name: Prüfen und Release-Paket erstellen

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP-Syntax prüfen
        shell: bash
        run: find mgd-giveaway tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Plugin-Icon und vollständige Kollektion prüfen
        run: |
          php tests/plugin-icon-test.php
          php tests/catalog-package.php
      - name: Release-Paket bauen
        shell: bash
        run: |
          version="$(sed -n 's/^ \* Version: //p' mgd-giveaway/mgd-giveaway.php | head -1)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag und Plugin-Version stimmen nicht überein" >&2
            exit 1
          fi
          bash scripts/build-release.sh "$version"
      - name: Paketstruktur prüfen
        run: |
          (cd build && sha256sum mgd-giveaway.zip > mgd-giveaway.zip.sha256)
          test "$(unzip -Z1 build/mgd-giveaway.zip | grep -c '^mgd-giveaway/mgd-giveaway.php$')" -eq 1
          unzip -tq build/mgd-giveaway.zip
          python3 scripts/check_plugin_ready.py . --zip build/mgd-giveaway.zip
          python3 scripts/check-catalog-zip.py build/mgd-giveaway.zip
      - if: matrix.php == '8.4'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mgd-giveaway
          path: |
            build/mgd-giveaway.zip
            build/mgd-giveaway.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pruefen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mgd-giveaway
          path: build
      - name: GitHub-Release mit installierbarem ZIP veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Ein manuell geprüfter Entwurf kann bereits veröffentlicht sein.
            # ZIP-Zeitstempel dürfen abweichen, Dateiinhalt und Pfade nicht.
            mkdir -p "$RUNNER_TEMP/mgd-existing"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --pattern mgd-giveaway.zip --dir "$RUNNER_TEMP/mgd-existing"
            existing="$RUNNER_TEMP/mgd-existing/mgd-giveaway.zip"
            diff -u <(unzip -Z1 build/mgd-giveaway.zip | sort) <(unzip -Z1 "$existing" | sort)
            while IFS= read -r path; do
              [[ "$path" == */ ]] && continue
              cmp <(unzip -p build/mgd-giveaway.zip "$path") <(unzip -p "$existing" "$path")
            done < <(unzip -Z1 build/mgd-giveaway.zip)
          else
            (cd build && sha256sum -c mgd-giveaway.zip.sha256)
            gh release create "$GITHUB_REF_NAME" build/mgd-giveaway.zip build/mgd-giveaway.zip.sha256 \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
